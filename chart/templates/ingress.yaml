{{- if and .Values.dashboard.enabled .Values.dashboard.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.dashboard.ingress.ingressClassName }}
  rules:
    - host: {{ required "dashboard.ingress.host is required when dashboard.ingress.enabled is true" .Values.dashboard.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-agent
                port:
                  number: {{ .Values.dashboard.port }}
{{- end }}
