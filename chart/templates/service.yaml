{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hermes.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.dashboard.port }}
      targetPort: {{ .Values.dashboard.port }}
      protocol: TCP
{{- end }}
